<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wintermaze</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: #0b1020;
        color: #e6edf7;
        font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #app { display: flex; height: 100%; }
      #stage { flex: 1; position: relative; min-width: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #side {
        width: 260px; flex: none; padding: 16px;
        background: #111a30; border-left: 1px solid #223052;
        display: flex; flex-direction: column; gap: 14px;
        overflow-y: auto;
      }
      h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
      .sub { margin: 0; font-size: 11px; color: #7d8dae; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { background: #0c1428; border: 1px solid #223052; border-radius: 6px; padding: 8px; }
      .stat b { display: block; font-size: 17px; }
      .stat span { font-size: 10px; color: #7d8dae; text-transform: uppercase; letter-spacing: .08em; }
      .towers { display: flex; flex-direction: column; gap: 6px; }
      button {
        font: inherit; color: inherit; text-align: left; cursor: pointer;
        background: #16233f; border: 1px solid #2b3c63; border-radius: 6px; padding: 8px 10px;
      }
      button:hover:not(:disabled) { background: #1e2f52; }
      button[aria-pressed="true"] { border-color: #6ea8ff; background: #1e3a6b; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button small { display: block; font-size: 10px; color: #8fa2c6; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; text-align: center; }
      .hint { font-size: 11px; color: #7d8dae; }
      kbd { background: #0c1428; border: 1px solid #2b3c63; border-radius: 3px; padding: 0 4px; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="game"></canvas></div>
      <aside id="side"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
